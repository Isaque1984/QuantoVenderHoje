<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Sellium PRO</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#07111f,#101827);
    color:white;
    min-height:100vh;
}

.container{
    width:min(92%,480px);
    margin:auto;
    padding:30px 0;
}

.card{
    background:#111c2d;
    border:1px solid #26364e;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin:5px 0 8px;
    font-size:34px;
}

.subtitle{
    text-align:center;
    color:#aebbd0;
    margin-bottom:25px;
}

.pro{
    color:#37d17a;
}

.price{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin:15px 0;
}

.price small{
    font-size:15px;
    color:#aebbd0;
}

.features{
    margin:20px 0;
    padding:0;
    list-style:none;
}

.features li{
    padding:9px 0;
    color:#dce5f2;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid #33445f;
    background:#0a1321;
    color:white;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#37d17a;
}

label{
    display:block;
    margin-top:12px;
    font-size:13px;
    color:#aebbd0;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-green{
    background:#37d17a;
    color:#07111f;
}

.btn-dark{
    background:#26364e;
    color:white;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#0a1321;
    color:#cbd6e5;
    font-size:14px;
    word-break:break-word;
}

.hidden{
    display:none;
}

.divider{
    height:1px;
    background:#26364e;
    margin:25px 0;
}

.note{
    font-size:12px;
    color:#8fa0b8;
    line-height:1.5;
    margin-top:12px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Sellium <span class="pro">PRO</span></h1>

<div class="subtitle">
Venda melhor. Tenha mais controle.
</div>

<div class="price">
R$ 9,90 <small>/mês</small>
</div>

<ul class="features">
<li>✅ Recursos PRO do Sellium</li>
<li>✅ Mais ferramentas para suas vendas</li>
<li>✅ Acesso à Área PRO</li>
<li>✅ Assinatura mensal</li>
</ul>

<div id="loginBox">

<label>E-mail da sua conta Sellium</label>
<input
    id="email"
    type="email"
    placeholder="seu@email.com"
>

<label>Senha</label>
<input
    id="password"
    type="password"
    placeholder="Sua senha"
>

<button
    class="btn-green"
    onclick="entrar()"
>
Entrar
</button>

<button
    class="btn-dark"
    onclick="criarConta()"
>
Criar conta
</button>

</div>

<div id="accountBox" class="hidden">

<div id="accountInfo" class="status"></div>

<div class="divider"></div>

<label>
E-mail da conta do Mercado Pago
</label>

<input
    id="mpEmail"
    type="email"
    placeholder="E-mail usado no Mercado Pago"
>

<button
    class="btn-green"
    onclick="assinar()"
>
💳 ASSINAR PRO
</button>

<button
    class="btn-dark"
    onclick="sair()"
>
Sair
</button>

</div>

<div id="status" class="status hidden"></div>

<div class="note">
Use no campo do Mercado Pago o e-mail da conta que será usada para realizar a assinatura.
</div>

</div>

</div>

<script>

const API_URL =
    "https://sellium-api.onrender.com";

const EMAIL_KEY =
    "sellium_email";

const TOKEN_KEY =
    "sellium_token";

const PRO_KEY =
    "sellium_pro";

const MP_EMAIL_KEY =
    "sellium_mp_email";


function mostrarStatus(
    mensagem,
    erro = false
){
    const box =
        document.getElementById("status");

    box.classList.remove("hidden");

    box.style.color =
        erro ? "#ff8d8d" : "#cbd6e5";

    box.textContent =
        mensagem;
}


function extrairMensagemErro(
    valor
){
    if(
        valor === null ||
        valor === undefined
    ){
        return "";
    }

    if(
        typeof valor === "string"
    ){
        const texto =
            valor.trim();

        if(!texto){
            return "";
        }

        try{
            const convertido =
                JSON.parse(texto);

            return extrairMensagemErro(
                convertido
            );
        }catch(e){
            return texto;
        }
    }

    if(Array.isArray(valor)){
        for(
            const item of valor
        ){
            const mensagem =
                extrairMensagemErro(item);

            if(mensagem){
                return mensagem;
            }
        }

        return "";
    }

    if(
        typeof valor === "object"
    ){

        const campos = [
            "message",
            "error",
            "description",
            "detail",
            "cause",
            "data",
            "mercadopago"
        ];

        for(
            const campo of campos
        ){
            if(
                valor[campo] !== undefined
            ){
                const mensagem =
                    extrairMensagemErro(
                        valor[campo]
                    );

                if(mensagem){
                    return mensagem;
                }
            }
        }

        try{
            return JSON.stringify(
                valor
            );
        }catch(e){
            return "";
        }
    }

    return String(valor);
}


async function lerRespostaJSON(
    response
){

    const texto =
        await response.text();

    if(!texto){
        return {};
    }

    try{
        return JSON.parse(texto);
    }catch(e){
        return {
            detail: texto
        };
    }
}


function salvarSessao(
    token,
    email,
    pro
){

    localStorage.setItem(
        TOKEN_KEY,
        token
    );

    localStorage.setItem(
        EMAIL_KEY,
        email
    );

    localStorage.setItem(
        PRO_KEY,
        pro ? "true" : "false"
    );
}


function mostrarConta(
    email,
    pro
){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("accountBox")
        .classList.remove("hidden");

    document
        .getElementById("accountInfo")
        .textContent =
        "Conta Sellium: " + email;

    if(pro){

        mostrarStatus(
            "Sua conta já possui PRO."
        );

        document
            .getElementById("mpEmail")
            .disabled = true;
    }
}


async function criarConta(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    if(!email || !password){

        mostrarStatus(
            "Preencha e-mail e senha.",
            true
        );

        return;
    }

    mostrarStatus(
        "Criando sua conta..."
    );

    try{

        const response =
            await fetch(
                API_URL +
                "/criar-conta-pro",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );

        const data =
            await lerRespostaJSON(
                response
            );

        if(!response.ok){

            const mensagem =
                extrairMensagemErro(
                    data
                );

            mostrarStatus(
                mensagem ||
                "Não foi possível criar a conta.",
                true
            );

            return;
        }

        salvarSessao(
            data.token,
            data.email || email,
            data.pro
        );

        mostrarConta(
            data.email || email,
            data.pro
        );

        mostrarStatus(
            "Conta criada com sucesso."
        );

    }catch(error){

        mostrarStatus(
            "Erro de conexão com o servidor.",
            true
        );
    }
}


async function entrar(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    if(!email || !password){

        mostrarStatus(
            "Preencha e-mail e senha.",
            true
        );

        return;
    }

    mostrarStatus(
        "Entrando..."
    );

    try{

        const response =
            await fetch(
                API_URL +
                "/login-pro",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );

        const data =
            await lerRespostaJSON(
                response
            );

        if(!response.ok){

            const mensagem =
                extrairMensagemErro(
                    data
                );

            mostrarStatus(
                mensagem ||
                "E-mail ou senha incorretos.",
                true
            );

            return;
        }

        salvarSessao(
            data.token,
            data.email || email,
            data.pro
        );

        mostrarConta(
            data.email || email,
            data.pro
        );

        mostrarStatus(
            "Login realizado."
        );

    }catch(error){

        mostrarStatus(
            "Erro de conexão com o servidor.",
            true
        );
    }
}


async function assinar(){

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );

    if(!token){

        mostrarStatus(
            "Faça login primeiro.",
            true
        );

        return;
    }

    const mpEmail =
        document
        .getElementById("mpEmail")
        .value
        .trim();

    if(!mpEmail){

        mostrarStatus(
            "Digite o e-mail da sua conta do Mercado Pago.",
            true
        );

        return;
    }

    localStorage.setItem(
        MP_EMAIL_KEY,
        mpEmail
    );

    mostrarStatus(
        "Preparando assinatura..."
    );

    try{

        const response =
            await fetch(
                API_URL +
                "/assinar",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        token:token,
                        mp_email:mpEmail
                    })
                }
            );

        const data =
            await lerRespostaJSON(
                response
            );

        console.log(
            "Resposta /assinar:",
            data
        );

        if(!response.ok){

            const mensagem =
                extrairMensagemErro(
                    data
                );

            mostrarStatus(
                mensagem ||
                "Não foi possível iniciar a assinatura.",
                true
            );

            return;
        }

        if(data.pro){

            localStorage.setItem(
                PRO_KEY,
                "true"
            );

            window.location.href =
                "./area-pro.html";

            return;
        }

        const checkout =
            data.checkout_url ||
            data.init_point ||
            data.sandbox_init_point;

        if(checkout){

            window.location.href =
                checkout;

            return;
        }

        mostrarStatus(
            "O Mercado Pago não retornou o link de pagamento.",
            true
        );

    }catch(error){

        console.error(error);

        mostrarStatus(
            "Erro de conexão com o servidor.",
            true
        );
    }
}


function sair(){

    localStorage.removeItem(
        TOKEN_KEY
    );

    localStorage.removeItem(
        EMAIL_KEY
    );

    localStorage.removeItem(
        PRO_KEY
    );

    location.reload();
}


async function verificarSessao(){

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );

    if(!token){
        return;
    }

    try{

        const response =
            await fetch(
                API_URL +
                "/verificar-sessao?token=" +
                encodeURIComponent(token)
            );

        const data =
            await lerRespostaJSON(
                response
            );

        if(!response.ok){

            localStorage.removeItem(
                TOKEN_KEY
            );

            return;
        }

        salvarSessao(
            token,
            data.email,
            data.pro
        );

        mostrarConta(
            data.email,
            data.pro
        );

        const mpEmail =
            localStorage.getItem(
                MP_EMAIL_KEY
            );

        if(mpEmail){

            document
            .getElementById("mpEmail")
            .value = mpEmail;
        }

        if(data.pro){

            mostrarStatus(
                "Sua conta já possui PRO."
            );
        }

    }catch(error){

        console.error(error);
    }
}


verificarSessao();

</script>

</body>
    </html>
